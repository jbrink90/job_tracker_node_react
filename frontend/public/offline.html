<!DOCTYPE html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W1YSPJQ3XC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-W1YSPJQ3XC');
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-128x128.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrackr - Your Fast and Easy Job Tracking Companion</title>
    <meta
      name="title"
      content="JobTrackr - Your Fast and Easy Job Tracking Companion"
    />
    <meta
      name="description"
      content="JobTrackr is a simple and efficient web app for tracking your job applications, statuses, and updates. Open source and built with React and Supabase."
    />
    <meta
      name="keywords"
      content="job tracker, job applications, job management, React, Supabase, career tracking, application tracker, open source, github, jobtrackr"
    />
    <link rel="canonical" href="https://jobtrackr.online/" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #fafafa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }

      .paper {
        background: white;
        padding: 2rem;
        border-radius: 4px;
        box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2),
                    0px 1px 1px 0px rgba(0,0,0,0.14),
                    0px 1px 3px 0px rgba(0,0,0,0.12);
        width: 100%;
        max-width: 420px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: #1976d2;
      }

      .subtitle {
        font-size: 0.875rem;
        color: #64748b;
        margin-bottom: 1.5rem;
      }

      .icon {
        font-size: 4rem;
        text-align: center;
        margin-bottom: 1rem;
      }

      .message {
        font-size: 1rem;
        color: #475569;
        line-height: 1.5;
        margin-bottom: 1rem;
      }

      .retry-button {
        display: inline-block;
        background-color: #1976d2;
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.2s;
        margin-top: 1rem;
      }

      .retry-button:hover {
        background-color: #1565c0;
      }

      footer {
        text-align: center;
        padding: 1rem;
        color: #64748b;
        font-size: 0.875rem;
        border-top: 1px solid #e2e8f0;
      }

      footer a {
        color: #1976d2;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .paper {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="paper">
        <h1 style="text-align: center;">JobTrackr.online</h1>
        <div class="icon"><img src="icon-128x128.png" alt="offline"/></div>
        <h1>You're Offline!</h1>
        <p class="subtitle">Please check your internet connection</p>
        <p class="message">
          JobTrackr requires an internet connection to load and display your jobs.
        </p>
        <button class="retry-button" onclick="window.location.reload()">
          Try Again
        </button>
      </div>
    </div>
    <footer>
      <a href="https://jobtrackr.online">JobTrackr.online</a>
    </footer>
  </body>
</html>
